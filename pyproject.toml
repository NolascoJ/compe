[project]
name = "compe"
version = "0.1.0"
description = "TP3 ML ITBA - Grupo 9: prediccion de cancelacion de trabajos (balanced accuracy)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy",
    "scikit-learn>=1.5",
    "matplotlib",
    "seaborn",
    "jupytext",
    "nbconvert",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compe"]
